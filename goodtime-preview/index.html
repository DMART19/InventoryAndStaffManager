.gt-hero .gt-art img{display:none}
.gt-chip{border-radius:999px;font-size:11px;letter-spacing:.005em}
.gt-section-title{letter-spacing:-.045em;font-size:24px;font-weight:850}
.gt-section-head>button{color:#91deff;font-weight:750}
.gt-category-grid{gap:12px}
.gt-cat{border-radius:19px;min-height:99px;transition:transform .15s ease,background .15s ease;align-items:center}
.gt-cat:hover{transform:translateY(-2px);background:rgba(93,145,243,.15)}
.gt-cat small{color:#96acc9}
.gt-product{border-radius:20px;padding:9px;overflow:hidden;transition:transform .2s ease,border-color .2s ease}
.gt-product:hover{transform:translateY(-2px)}
.gt-product.gt-chosen{border-color:rgba(94,224,226,.55)}
.gt-product-art{min-height:165px;background:radial-gradient(circle at 50% 85%,rgba(87,126,233,.23),transparent 65%),linear-gradient(140deg,#202e58,#171d3c);border:1px solid rgba(179,203,253,.08);border-radius:15px}
.gt-product-art img.gt-photo{object-fit:contain;width:100%;height:170px;padding:8px 7px;filter:drop-shadow(0 11px 16px rgba(4,8,30,.35))}
.gt-tag{background:rgba(7,32,45,.77);border:1px solid rgba(114,219,196,.34);color:#b4ffe5;backdrop-filter:blur(10px);letter-spacing:.005em}
.gt-product-copy{padding:3px 4px 0}
.gt-product-copy h3{font-size:13px;min-height:34px;font-weight:760;line-height:1.3;letter-spacing:-.025em}
.gt-price{font-size:18px;letter-spacing:-.04em;color:white}
.gt-price small{letter-spacing:0;color:#a2b5d3;font-weight:500}
.gt-card-actions{padding:6px 3px 2px}
.gt-add{width:100%;display:flex;justify-content:space-between;align-items:center;gap:4px;box-shadow:none;padding:9px 12px;min-height:43px;font-size:12px}
.gt-add span:last-child{font-size:22px;line-height:1}
.gt-card-stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:rgba(96,157,238,.12);border:1px solid rgba(120,218,240,.38);border-radius:13px;min-height:44px;text-align:center;font-size:12px;font-weight:790;color:#a3f4ec}
.gt-card-stepper button{height:44px;border:0;background:transparent;color:#f3faff;font-size:24px;display:grid;place-items:center}
.gt-card-stepper button:first-child{border-right:1px solid rgba(156,201,245,.16)}
.gt-card-stepper button:last-child{border-left:1px solid rgba(156,201,245,.16)}
.gt-card-stepper button:disabled{opacity:.3}
.gt-package{border-radius:23px}
.gt-package-image{border-radius:18px}
.gt-package-copy h3{font-weight:800;letter-spacing:-.035em}
.gt-toolbar input,.gt-field input,.gt-field select,.gt-field textarea{background:rgba(13,27,60,.85);border-radius:13px;border:1px solid rgba(182,211,247,.22);min-height:48px;font-size:16px}
.gt-filter{gap:9px}
.gt-filter .gt-chip{white-space:nowrap;min-height:42px;display:inline-flex;align-items:center;justify-content:center}
.gt-panel{border-radius:24px}
.gt-cartbar{display:none}
@media (max-width:740px){
.gt-app{border-radius:0;overflow:visible}
.gt-app header{position:sticky;top:0;z-index:50}
.gt-header{height:65px;min-height:65px;padding:9px 16px 9px 15px}
.gt-logo-icon{width:40px;height:40px;font-size:22px;border-radius:13px}
.gt-logo strong{font-size:14px}
.gt-cartbtn{width:44px;height:44px;min-width:44px;border-radius:15px}
.gt-menu{font-size:20px}
.gt-nav{top:62px;background:rgba(13,23,53,.97);border-color:rgba(171,201,255,.24);border-radius:20px;padding:9px;box-shadow:0 22px 70px #000b;max-height:calc(100dvh - 90px);overflow:auto}
.gt-nav button{min-height:46px;font-size:14px;border-radius:12px}
.gt-shell{padding:12px 14px calc(128px + env(safe-area-inset-bottom,0px));}

.gt-hero:before{display:none}
.gt-hero .gt-art{display:none}
.gt-hero h1{font-size:clamp(37px,10.2vw,49px);line-height:1.03;margin:12px 0 10px;letter-spacing:-.07em;text-shadow:0 2px 10px #070d2577}
.gt-hero p{font-size:13px;line-height:1.5;margin:4px 0 0;color:#e5eafa;max-width:340px}
.gt-hero .gt-actions{display:flex;flex-wrap:nowrap;gap:9px;margin-top:20px}
.gt-hero .gt-actions .gt-btn{min-width:0;padding:12px 12px;font-size:12px;flex:1;min-height:49px;white-space:normal;text-align:center}
.gt-hero .gt-actions .gt-btn:first-child{flex:1.4}
.gt-hero-checks{display:flex;gap:10px;flex-wrap:nowrap;justify-content:space-between;margin-top:18px;overflow:hidden}
.gt-hero-checks span{font-size:9px;white-space:nowrap;letter-spacing:-.035em}
.gt-hero .gt-chip{align-self:flex-start;background:rgba(7,13,37,.5);border:1px solid #ffffff40;color:#f1f9ff;font-size:10px;padding:8px 11px;max-width:100%}
.gt-section-head{margin-top:27px;margin-bottom:12px;align-items:end;gap:8px}
.gt-section-title{font-size:21px;line-height:1.1}
.gt-section-head>button{font-size:11px;line-height:1.3;white-space:normal;text-align:right;max-width:115px}
.gt-category-grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(148px,42vw);display:grid;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;margin-right:-14px;padding:1px 14px 8px 0}
.gt-category-grid::-webkit-scrollbar{display:none}
.gt-cat{min-height:90px;padding:13px 12px;scroll-snap-align:start;border-radius:18px;flex-direction:column;align-items:flex-start;gap:4px;justify-content:space-between}
.gt-cat span:first-child{font-size:26px;line-height:1.1}
.gt-cat strong{font-size:12px}
.gt-cat small{display:none}
.gt-products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.gt-product{padding:7px;border-radius:19px}
.gt-product-art{height:144px;min-height:144px;border-radius:14px}
.gt-product-art img.gt-photo{height:139px;max-height:139px;padding:7px}
.gt-tag{top:6px;left:6px;padding:3px 7px;font-size:9px}
.gt-product-copy h3{font-size:12px;min-height:44px;margin-top:9px;margin-bottom:4px;line-height:1.32;letter-spacing:-.02em}
.gt-price{font-size:16px;margin-bottom:8px}
.gt-price small{font-size:10px}
.gt-card-actions{margin-top:auto;padding:3px 0 0}
.gt-add{font-size:12px;border-radius:12px;min-height:43px;padding:8px 10px}
.gt-card-stepper{grid-template-columns:42px minmax(0,1fr) 42px;min-height:43px}
.gt-card-stepper button{height:43px}
.gt-card-stepper span{font-size:11px}
.gt-package-grid,.gt-feature-grid,.gt-two-col,.gt-form-grid{grid-template-columns:1fr}
.gt-package-image{height:165px}
.gt-toolbar{display:flex;gap:9px;flex-wrap:wrap}
.gt-toolbar .gt-search{width:100%;flex:1 0 100%;min-height:49px}
.gt-toolbar .gt-btn{flex:1 1 100%;min-height:43px}
.gt-filter{display:flex;flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-right:-14px;padding:3px 14px 10px 0;gap:7px}
.gt-filter::-webkit-scrollbar{display:none}
.gt-filter .gt-chip{flex:none;scroll-snap-align:start;padding:8px 13px;font-size:11px}
.gt-page-title{font-size:38px;letter-spacing:-.065em;line-height:1.04}
.gt-panel{padding:17px;border-radius:21px}
.gt-field label{font-size:12px}
.gt-field input,.gt-field select,.gt-field textarea{font-size:16px;min-height:49px}
.gt-mini-stepper button{width:40px;height:40px}
.gt-bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:rgba(11,20,42,.94);border:1px solid rgba(193,211,255,.15);border-radius:22px 22px 0 0;padding:8px 8px calc(9px + env(safe-area-inset-bottom,0px));box-shadow:0 -15px 45px #02051d7c;backdrop-filter:blur(28px)}
.gt-bottom-nav button{position:relative;min-height:50px;min-width:0;border-radius:14px;padding:5px 4px;color:#aebfd9;font-size:10px;display:flex;justify-content:center;gap:2px;align-items:center}
.gt-bottom-nav button.active{color:#7ceafa;background:rgba(85,130,235,.15)}
.gt-bottom-nav button .gt-tabicon{font-size:24px;line-height:1;min-height:26px;font-weight:500}
.gt-bottom-nav button>span:not(.gt-tabicon){font-size:10px;line-height:1.1;letter-spacing:0;font-weight:650}
.gt-nav-count{position:absolute;font-style:normal;top:0;left:calc(50% + 8px);font-size:9px;background:#87e9eb;color:#0a1740;padding:0 5px;border-radius:100px;font-weight:850}
.gt-cartbar{display:flex;position:fixed;bottom:calc(77px + env(safe-area-inset-bottom,0px));left:11px;right:11px;z-index:55;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px 11px 14px;border:1px solid rgba(163,226,255,.35);border-radius:18px;background:rgba(25,41,80,.95);box-shadow:0 12px 32px #0009;backdrop-filter:blur(22px)}
.gt-cartbar div{min-width:0}
.gt-cartbar strong{display:block;font-size:12px;white-space:nowrap}
.gt-cartbar div>span{display:block;color:#a7bbd7;font-size:9px;white-space:nowrap}
.gt-cartbar .gt-btn{flex:none;font-size:12px;padding:10px 12px;min-height:43px}
.gt-footer{padding-bottom:12px}
.gt-toast{bottom:calc(165px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100vw - 26px)}
}
@media(max-width:370px){.gt-hero{padding:19px;min-height:510px}.gt-hero h1{font-size:36px}.gt-hero .gt-actions .gt-btn{font-size:11px}.gt-hero-checks span{font-size:8px}.gt-product-art{height:123px;min-height:123px}.gt-product-art img.gt-photo{height:120px}.gt-product-copy h3{font-size:11px}.gt-price small{font-size:9px}.gt-cartbar .gt-btn{font-size:11px}}

.gt-app{--muted:#a8b7d0;--line:rgba(192,210,242,.13);background:radial-gradient(ellipse 85% 20% at 92% 1%,#30427455,transparent 80%),#070e1e}
.gt-glass{background:linear-gradient(148deg,rgba(38,59,106,.64),rgba(19,29,60,.81));border:1px solid rgba(190,206,247,.15);box-shadow:0 15px 40px #01061544,inset 0 1px #ffffff10;backdrop-filter:blur(22px)}
.gt-shell{max-width:1240px}
.gt-btn{background:linear-gradient(112deg,#64dfeb 0%,#80b5fc 60%,#9d90f0 100%);color:#06162c;box-shadow:0 7px 20px #418dd42b;border-radius:14px;min-height:46px}
.gt-btn:hover{filter:brightness(1.06)}
.gt-quiet-link{background:transparent;border:0;color:#d6efff;font-weight:700;padding:12px 5px;min-height:42px}
.gt-logo-icon{background:#132743;color:#97e5ec;border:1px solid #6c99bc70;box-shadow:none}
.gt-hero{background-image:linear-gradient(90deg,#071128f6 0%,#071128d9 35%,#07112836 78%),var(--gt-hero-image);background-size:cover;background-position:center 54%;min-height:423px;padding:39px 41px;grid-template-columns:1fr;align-items:center;border-radius:26px;overflow:hidden}
.gt-hero:before{display:none}
.gt-hero-body{position:relative;z-index:1;max-width:625px}
.gt-hero h1{font-size:clamp(45px,5.6vw,67px);max-width:570px;line-height:1.04;letter-spacing:-.07em;margin:16px 0}
.gt-hero h1 .gt-gradient{background:linear-gradient(95deg,#81ecf3,#99bcfb 65%,#cc9ff2);background-clip:text;-webkit-background-clip:text;color:transparent}
.gt-hero p{font-size:15px;max-width:450px;color:#e0e8f3}

function gtPhoto(p){const src=gtProductPhotos[gtImageByProduct[p.id]];return src?`<img class="gt-photo" src="${src}" alt="Illustrative rental equipment: ${p.name}" loading="lazy" decoding="async">`:pic(p.art);}
function card(p){const n=s.cart[p.id]||0;return `<article class="gt-product gt-glass ${n?'gt-chosen':''}"><button class="gt-product-art" data-detail="${p.id}" aria-label="View details for ${p.name}">${gtPhoto(p)}<span class="gt-tag">${p.qty} ${p.qty===1?'unit':'units'}</span><span class="gt-photo-hint">View details ↗</span></button><div class="gt-product-copy"><h3>${p.name}</h3><div class="gt-price">${money(p.price)} <small>/ event*</small></div></div><div class="gt-card-actions">${n?`<div class="gt-card-stepper"><button data-dec="${p.id}" aria-label="Remove one ${p.name}">−</button><span>${n} selected</span><button data-add="${p.id}" aria-label="Add one ${p.name}" ${n>=p.qty?'disabled':''}>+</button></div>`:`<button class="gt-btn gt-add" data-add="${p.id}" aria-label="Add ${p.name} to your party"><span>Add to party</span><span aria-hidden="true">+</span></button>`}</div></article>`;}

function packageCard(p){return `<article class="gt-package gt-glass"><div class="gt-package-image gt-package-photo"><img src="${gtPackagePhotos[p.id]||gtPackagePhotos.birthday}" loading="lazy" decoding="async" alt="Illustrative party equipment package"></div><div class="gt-package-copy"><div class="gt-eyebrow">Easy-to-book bundle</div><h3>${p.name}</h3><p>${p.desc}</p><div class="gt-row"><b style="font-size:24px">${money(p.price)}</b><span class="gt-hint">Example starting price*</span></div><button class="gt-btn wide" data-package="${p.id}">Add this package <span aria-hidden="true">→</span></button></div></article>`;}

function home(){return `<section class="gt-hero gt-glass"><div class="gt-hero-body"><span class="gt-chip">Sacramento & Elk Grove · Local party rentals</span><h1>Everything you need for <span class="gt-gradient">a great party.</span></h1><p>Bounce houses, concessions, and event essentials. Pick your favorites and make a party plan in minutes.</p><div class="gt-actions"><button class="gt-btn" data-go="rentals">Explore rentals <span aria-hidden="true">→</span></button><button class="gt-quiet-link" data-go="packages">See party packages <span aria-hidden="true">↗</span></button></div><div class="gt-hero-checks"><span>17 rental options</span><span>Locally focused</span></div></div></section><div class="gt-quickdate gt-glass"><div class="gt-quickdate-copy"><span class="gt-quick-icon">◷</span><div><strong>When’s the celebration?</strong><small>Choose a date to start planning.</small></div></div><div class="gt-quickdate-action"><input type="date" id="gt-quick-date" value="${s.date||''}" aria-label="Event date"><button class="gt-btn" data-quick="1">Browse rentals →</button></div></div><div class="gt-section-head"><h2 class="gt-section-title">What are you celebrating with?</h2><button data-go="rentals">All rentals →</button></div><div class="gt-category-grid">${cats.filter(x=>x[0]!=='all').map(([k,n,e])=>`<button class="gt-cat gt-glass" data-category="${k}"><span>${e}</span><span><strong>${n}</strong></span></button>`).join('')}</div><div class="gt-section-head"><h2 class="gt-section-title">Popular rentals</h2><button data-go="rentals">View all 17 →</button></div><div class="gt-products">${[products[0],products[3],products[4],products[9]].map(card).join('')}</div><div class="gt-banner gt-glass"><div><h2 class="gt-section-title">Make room for fun, not more planning.</h2><p>Build your party at your pace. No account, deposit or payment is collected in this preview.</p></div><button class="gt-btn" data-go="packages">Explore packages →</button></div>`;}

function rentals(){const list=products.filter(p=>(s.category==='all'||p.cat===s.category)&&p.name.toLowerCase().includes(s.q.toLowerCase()));return `<div class="gt-eyebrow">The collection · 31 owned units</div><div class="gt-catalog-title"><div><h1 class="gt-page-title">Find your <span class="gt-gradient">fun.</span></h1><p class="gt-muted">17 equipment options. Find the right fit for your party.</p></div><div class="gt-catalog-count">${cartCount()} in your party</div></div><div class="gt-toolbar"><input class="gt-search" type="search" id="gt-search" placeholder="Search rentals…" value="${escapeAttr(s.q)}" aria-label="Search rentals"><button class="gt-btn" data-go="booking">Review party (${cartCount()}) →</button></div><div class="gt-filter">${cats.map(([k,n,e])=>`<button class="gt-chip ${s.category===k?'selected':''}" data-filter="${k}">${e} ${n}</button>`).join('')}</div><div id="gt-products" class="gt-products">${list.map(card).join('')}</div>${!list.length?'<div class="gt-glass gt-panel">No matching equipment. Try another search.</div>':''}<div class="gt-alert" style="margin-top:20px">Photos are illustrative. Prices are examples, and availability is not checked live in this preview.</div>`;}

function packagesPage(){return `<div class="gt-eyebrow">Ready-to-go event ideas</div><h1 class="gt-page-title">Packages <span class="gt-gradient">& Deals</span></h1><p class="gt-muted" style="font-size:13px;margin-bottom:20px">Save time choosing equipment with these ready-made combinations.</p><div class="gt-package-grid">${packages.map(packageCard).join('')}</div><div class="gt-banner gt-glass"><div><h3 style="margin:0">Planning a school carnival or larger event?</h3><p>Mix multiple inflatables, concessions, and tables in one custom request.</p></div><button class="gt-btn" data-go="contact">Request Custom Quote →</button></div>`;}
function booking(){const step=s.bookingStep||1;const stepHead=`<div class="gt-flowsteps"><div class="${step===1?'active':'complete'}"><span>${step===1?'1':'✓'}</span>Rentals & date</div><i></i><div class="${step===2?'active':''}"><span>2</span>Event details</div></div>`;const cartContent=`${cartItems().length?cartItems().map(p=>`<div class="gt-cart-row"><div class="gt-cart-photo">${gtPhoto(p)}</div><div class="grow"><h4>${p.name}</h4><small>${money(p.price)} × ${s.cart[p.id]}</small></div><div class="gt-mini-stepper"><button data-dec="${p.id}" aria-label="Remove one ${p.name}">−</button><span>${s.cart[p.id]}</span><button data-add="${p.id}" aria-label="Add one ${p.name}" ${s.cart[p.id]>=p.qty?'disabled':''}>+</button></div></div>`).join(''):`<div class="gt-empty"><span>✳</span><h3>Let’s build your party.</h3><p>Browse the rentals or try a package.</p><button class="gt-btn" data-go="rentals">Browse rentals →</button></div>`}`;return `<div class="gt-eyebrow">No account needed · Preview only</div><h1 class="gt-page-title">Your party, <span class="gt-gradient">made easy.</span></h1><p class="gt-muted">A few details and you’re ready to request a quote.</p>${stepHead}${step===1?`<div class="gt-two-col gt-bookgrid"><section class="gt-panel gt-glass gt-datepanel"><span class="gt-mini-eyebrow">STEP 01</span><h2 class="gt-section-title">Choose your date.</h2><p class="gt-muted">When is the celebration?</p><div class="gt-field"><label for="gt-date">Event date *</label><input id="gt-date" name="date" type="date" value="${s.date||''}" required></div><div class="gt-note">We’ll confirm equipment availability before any booking is accepted.</div></section><section class="gt-panel gt-glass"><div class="gt-row"><h2 class="gt-section-title">Your rentals</h2><span class="gt-hint">${cartCount()} selected</span></div>${cartContent}<div class="gt-row gt-total"><span>Estimated subtotal</span><span>${money(total())}</span></div>${pkgDiscount()>0?`<div class="gt-row" style="font-size:12px;color:#91eccf">Package savings <b>−${money(pkgDiscount())}</b></div>`:''}<p class="gt-note">Illustrative equipment prices only. Delivery, taxes and supplies are extra.</p><div class="gt-book-actions"><button class="gt-btn ghost" data-go="rentals">Add rentals</button><button class="gt-btn" data-next="2" ${!cartCount()?'disabled':''}>Continue →</button></div></section></div>`:`<div class="gt-two-col gt-bookgrid"><section class="gt-panel gt-glass"><span class="gt-mini-eyebrow">STEP 02</span><h2 class="gt-section-title">Just a few details.</h2><p class="gt-muted">No account or payment required.</p><form id="gt-book-form"><input type="hidden" name="date" value="${s.date||''}"><div class="gt-form-grid"><div class="gt-field"><label for="gt-name">Your name *</label><input id="gt-name" name="name" required autocomplete="name" placeholder="Full name" value="${escapeAttr(s.name)}"></div><div class="gt-field"><label for="gt-email">Email address *</label><input id="gt-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" value="${escapeAttr(s.email)}"></div></div><div class="gt-form-grid"><div class="gt-field"><label for="gt-address">Event city or address *</label><input id="gt-address" name="address" required placeholder="Sacramento, CA" value="${escapeAttr(s.address)}"></div><div class="gt-field"><label for="gt-event">Type of event</label><select id="gt-event" name="eventType">${['Birthday','School event','Company event','Family gathering','Other'].map(v=>`<option ${s.eventType===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="gt-field"><label for="gt-delivery">How will you get the equipment?</label><select id="gt-delivery" name="delivery"><option>Request delivery and setup</option><option>Ask about customer pickup</option></select></div><div class="gt-book-actions"><button type="button" class="gt-btn ghost" data-next="1">← Back</button><button class="gt-btn" type="submit">Review request →</button></div><p class="gt-note">Preview only. Your information will not be sent or stored.</p></form></section><section class="gt-panel gt-glass"><h2 class="gt-section-title">At a glance</h2><p class="gt-muted">${s.date||'No date selected'} · ${cartCount()} rental units</p>${cartContent}<div class="gt-row gt-total"><span>Equipment subtotal</span><span>${money(total())}</span></div><p class="gt-note">Final price and availability must be verified by the business.</p></section></div>`}`;}

function confirmed(){return `<div class="gt-confirm gt-glass"><div class="big">✨</div><div class="gt-eyebrow">Interactive preview only</div><h1 class="gt-page-title">Your request <span class="gt-gradient">preview</span></h1><p>You selected <b>${cartCount()} rental units</b> for <b>${s.date}</b> with an estimated equipment subtotal of <b>${money(total())}</b>.</p><div class="gt-alert">No reservation was placed, no payment was collected, and no confirmation was sent. This shows what the final website's confirmation screen could look like.</div><button class="gt-btn" data-go="rentals" style="margin-top:20px">Continue Exploring →</button></div>`;}
function about(){return `<div class="gt-eyebrow">Your local event rental business</div><h1 class="gt-page-title">More fun. <span class="gt-gradient">Less fuss.</span></h1><div class="gt-two-col" style="margin:24px 0"><div class="gt-panel gt-glass"><h2 class="gt-section-title">Meet Good Time Party Co.</h2><p class="gt-muted" style="line-height:1.8;font-size:14px">We're building a simpler way for Sacramento and Elk Grove families, schools, and organizations to rent bounce houses, carnival concessions, and party equipment. Choose the pieces your event needs and reach out from one place.</p><button class="gt-btn" data-go="rentals">See Our Rentals →</button></div><div class="gt-art gt-glass" style="min-height:270px">${pic('bounce')}</div></div><div class="gt-feature-grid">${[['🧼','Care for equipment','Inspection and cleaning workflows are built into our operating plan.'],['📍','Local service','Focused on the Sacramento and Elk Grove area.'],['🎊','Small parties to big events','From backyard birthdays to school carnivals.']].map(x=>`<div class="gt-feature gt-glass"><div class="ico">${x[0]}</div><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div>`;}
function faqs(){const faqs=[['Can I reserve online?','This preview lets you prepare a reservation, but it does not submit a live booking. The production website will confirm availability and the final rental agreement before collecting payment.'],['Do you deliver and set up?','Delivery and setup can be requested. Service area, scheduling, site access, and pricing must be confirmed for each event.'],['What comes with concession machines?','Machine rentals and consumables are shown separately. Popcorn kits, cotton candy sugar, snow cone syrup, cups, bags, ice, and other supplies may require add-ons.'],['Can I rent more than one machine?','Yes, when inventory permits. For example, there are two Gold Medal popcorn machines and two El Nacho Grande machines in your listed inventory.'],['What about inflatables and safety?','Inflatables require appropriate space, surfaces, anchoring, access to power, supervision, and attention to weather conditions. The real booking flow should verify these requirements.'],['Are prices final?','No. Displayed prices are starter estimates and should be updated with your confirmed pricing and policies before launch.']];return `<div class="gt-eyebrow">Quick answers</div><h1 class="gt-page-title">Frequently asked <span class="gt-gradient">questions</span></h1><p class="gt-muted" style="font-size:13px;margin:0 0 20px">The essentials, without the back-and-forth.</p>${faqs.map((f,i)=>`<details class="gt-faq gt-glass" ${i===0?'open':''}><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}<div class="gt-banner gt-glass"><div><h3 style="margin:0">Still have a question?</h3><p>Send an inquiry about a machine, package, or event.</p></div><button class="gt-btn" data-go="contact">Contact Us →</button></div>`;}
function contact(){return `<div class="gt-eyebrow">We'd love to hear from you</div><h1 class="gt-page-title">Let's make it a <span class="gt-gradient">great day.</span></h1><div class="gt-two-col" style="margin-top:24px"><div class="gt-panel gt-glass"><h2 class="gt-section-title">Tell us about your event</h2><p class="gt-muted" style="font-size:13px;line-height:1.65">Ask about a machine, package, quote, or delivery. This interactive preview won't actually transmit your message.</p><form id="gt-contact-form"><div class="gt-field"><label for="gt-cname">Name</label><input id="gt-cname" required placeholder="Your name"></div><div class="gt-field"><label for="gt-cemail">Email</label><input id="gt-cemail" type="email" required placeholder="you@example.com"></div><div class="gt-field"><label for="gt-cmsg">Message</label><textarea id="gt-cmsg" required placeholder="Tell us your event date, location, and what you're interested in…"></textarea></div><button class="gt-btn wide" type="submit">Preview Inquiry →</button></form></div><div class="gt-panel gt-glass"><h2 class="gt-section-title">Service area</h2><p class="gt-muted" style="line-height:1.8;font-size:14px">Sacramento • Elk Grove • Nearby communities (coverage to be confirmed)</p><div class="gt-glass" style="padding:30px;margin:19px 0;text-align:center;font-size:58px">📍<div style="font-size:13px;font-weight:800;margin-top:8px">Locally focused.</div><div class="gt-hint">Greater Sacramento, California</div></div><div class="gt-alert">Phone number, email address, business hours, and delivery policies can be added after verification.</div></div></div>`;}
function owner(){return `<div class="gt-row"><div><div class="gt-eyebrow">Owner workspace · demo</div><h1 class="gt-page-title">Business <span class="gt-gradient">Dashboard</span></h1><p class="gt-muted" style="font-size:12px">Sample interface — not connected to your real bookings.</p></div><span class="gt-chip">🔒 Preview only</span></div><div class="gt-dashboard-grid">${[['📦','31','Equipment units'],['🗂️','17','Rental listings'],['🗓️','0','Live bookings in preview'],['💳','$0','Payments collected']].map(x=>`<div class="gt-stat gt-glass"><div>${x[0]}</div><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div><div class="gt-two-col"><div class="gt-panel gt-glass"><h2 class="gt-section-title">Inventory at a glance</h2><table class="gt-table"><thead><tr><th>Category</th><th>Units</th><th>Status</th></tr></thead><tbody>${[['Inflatables','3'],['Popcorn & cotton candy','6'],['Snow cones & frozen','4'],['Nachos & hot dogs','4'],['Tables & equipment','14']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="gt-pill">Cataloged</span></td></tr>`).join('')}</tbody></table></div><div class="gt-panel gt-glass"><h2 class="gt-section-title">Booking activity</h2><div style="text-align:center;padding:35px 10px"><div style="font-size:42px">🗓️</div><h3>No live reservations</h3><p class="gt-muted" style="font-size:12px">Connect a hosted database and payment provider to manage actual bookings here.</p></div><div class="gt-alert">This in-chat preview uses local interface state only. It does not modify your business records.</div></div></div>`;}
function bottom(){return `<div class="gt-bottom-nav" role="navigation" aria-label="Mobile navigation">${[['home','⌂','Home'],['rentals','▦','Explore'],['packages','✧','Packages'],['booking','◫','My party']].map(x=>`<button class="${s.page===x[0]?'active':''}" data-go="${x[0]}" aria-label="${x[2]}${x[0]==='booking'?', '+cartCount()+' items':''}"><span class="gt-tabicon">${x[1]}</span><span>${x[2]}</span>${x[0]==='booking'&&cartCount()?`<em class="gt-nav-count">${cartCount()}</em>`:''}</button>`).join('')}</div>`;}
function gtCartBar(){return cartCount()&&s.page!=='booking'&&s.page!=='confirmed'?`<div class="gt-cartbar"><div><strong>${cartCount()} ${cartCount()===1?'item':'items'} selected</strong><span>Estimated ${money(total())} · before delivery</span></div><button class="gt-btn" data-go="booking">Review party <span aria-hidden="true">→</span></button></div>`:'';}
function escapeAttr(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function detailModal(){if(!s.detail)return '';const p=products.find(x=>x.id===s.detail);if(!p)return '';return `<div class="gt-modal-scrim" data-close="1"><section class="gt-detail gt-glass" role="dialog" aria-modal="true" aria-label="${p.name}"><button class="gt-detail-close" data-close="1" aria-label="Close details">×</button><div class="gt-detail-image">${gtPhoto(p)}</div><div class="gt-detail-copy"><span class="gt-mini-eyebrow">RENTAL EQUIPMENT</span><h2>${p.name}</h2><p class="gt-muted">An easy addition to birthdays, community events and celebrations. Ask about setup, supplies and equipment requirements before booking.</p><div class="gt-detail-meta"><span>◈ ${p.qty} ${p.qty===1?'unit':'units'} owned</span><span>◷ Event rental</span></div><div class="gt-row gt-total"><span>Example starting price</span><strong>${money(p.price)}</strong></div><p class="gt-note">Illustrative photo and pricing; not a live availability check.</p><button class="gt-btn wide" data-add="${p.id}" ${s.cart[p.id]>=p.qty?'disabled':''}>${s.cart[p.id]?'Add another':'Add to my party'} →</button></div></section></div>`;}
function render(){root.innerHTML=header()+`<main class="gt-shell">${{home,rentals,packages:packagesPage,booking,confirmed,about,faqs,contact,owner}[s.page]?.()||home()}</main><div class="gt-footer"><span>© Good Time Party Co. • Website preview</span><span>Design concept • No live reservations or payments</span></div>`+gtCartBar()+bottom()+detailModal();}
function toast(msg){const old=root.querySelector('.gt-toast');old?.remove();let e=document.createElement('div');e.className='gt-toast';e.textContent=msg;root.appendChild(e);setTimeout(()=>e.remove(),2200);}
function changeQty(id,d){let p=products.find(x=>x.id===id);const next=Math.max(0,Math.min(p.qty,(s.cart[id]||0)+d));if(d>0&&next===(s.cart[id]||0))return toast(`Only ${p.qty} ${p.qty===1?'unit':'units'} owned`);s.cart[id]=next;if(d<0&&s.pkg.length)s.pkg=[];render();if(d>0)toast('Added to your party ✨');}
function setPage(page){s.page=page;render();root.scrollIntoView({block:'start',behavior:'smooth'});}
root.addEventListener('click',e=>{if(e.target.classList.contains('gt-modal-scrim')){s.detail=null;render();return}let b=e.target.closest('button');if(!b)return;if(b.dataset.close){s.detail=null;render();return}if(b.dataset.detail){s.detail=b.dataset.detail;render();return}if(b.dataset.next){if(b.dataset.next==='2'&&!cartCount())return toast('Choose your rentals first');const date=root.querySelector('#gt-date');if(date&&b.dataset.next==='2'&&!date.value)return toast('Choose an event date');if(date)s.date=date.value;s.bookingStep=Number(b.dataset.next);render();root.scrollIntoView({block:'start',behavior:'smooth'});return}if(b.dataset.quick){s.date=root.querySelector('#gt-quick-date')?.value||'';setPage('rentals');return}if(b.dataset.menu){root.querySelector('#gt-nav')?.classList.toggle('open');return}if(b.dataset.go){setPage(b.dataset.go);return}if(b.dataset.category){s.category=b.dataset.category;setPage('rentals');return}if(b.dataset.filter){s.category=b.dataset.filter;render();return}if(b.dataset.add){changeQty(b.dataset.add,1);return}if(b.dataset.dec){changeQty(b.dataset.dec,-1);return}if(b.dataset.package){let p=packages.find(x=>x.id===b.dataset.package);if(p.ids.some(id=>(s.cart[id]||0)>=products.find(x=>x.id===id).qty))return toast('Remove a duplicate item first');p.ids.forEach(id=>s.cart[id]=(s.cart[id]||0)+1);s.pkg=[p.id];setPage('booking');toast('Package added to your party');}});
root.addEventListener('input',e=>{if(e.target.id==='gt-quick-date')s.date=e.target.value;if(e.target.id==='gt-date')s.date=e.target.value;if(e.target.id==='gt-search'){s.q=e.target.value;const target=root.querySelector('#gt-products');if(target)target.innerHTML=products.filter(p=>(s.category==='all'||p.cat===s.category)&&p.name.toLowerCase().includes(s.q.toLowerCase())).map(card).join('');}if(e.target.name&&e.target.closest('#gt-book-form'))s[e.target.name]=e.target.value;});root.addEventListener('change',e=>{if(e.target.name&&e.target.closest('#gt-book-form'))s[e.target.name]=e.target.value;});root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='gt-book-form'){if(!cartCount())return toast('Add rental equipment first');new FormData(e.target).forEach((v,k)=>s[k]=String(v));setPage('confirmed');}else if(e.target.id==='gt-contact-form')toast('Preview only — no message was sent');});render();})();
</script></body></html>
